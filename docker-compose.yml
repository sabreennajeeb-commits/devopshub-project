version: '3.8'

services:
  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  app1:
    build: ./app1
    ports:
      - "3000:3000"
    depends_on:
      - redis

  app2:
    build: ./app2
    ports:
      - "3001:3000"
    depends_on:
      - redis

volumes:
  redis_data: